name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # Use a service container to replicate docker-compose.test.yml
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: eitams_test
        ports:
          - 54322:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npm run playwright test
      env:
        # Pass test environment variables to the Next.js server and Playwright
        DATABASE_URL: postgresql://test_user:test_password@localhost:54322/eitams_test?sslmode=disable
        ENABLE_SANDBOX: "true"
        NEXTAUTH_SECRET: "ci_dummy_secret"
        NEXTAUTH_URL: "http://localhost:3000"
        KEYCLOAK_CLIENT_ID: "ci_dummy"
        KEYCLOAK_CLIENT_SECRET: "ci_dummy"
        KEYCLOAK_ISSUER: "http://localhost:8080/realms/eitams"
        
    - name: Upload Playwright artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30
