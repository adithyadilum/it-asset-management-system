name: Playwright Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: eitams_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d eitams_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://test_user:test_password@localhost:54322/eitams_test
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3001
      MOBILE_JWT_SECRET: ci-mobile-jwt-secret-at-least-32-characters
      KEYCLOAK_CLIENT_ID: ci-client
      KEYCLOAK_CLIENT_SECRET: ci-client-secret
      KEYCLOAK_ISSUER: https://keycloak.example.test/realms/eitams
      ENCRYPTION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      UPSTASH_REDIS_REST_URL: https://redis.example.test
      UPSTASH_REDIS_REST_TOKEN: ci-redis-token
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_ENABLE_SANDBOX: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run e2e

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
